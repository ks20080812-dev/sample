<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>私のホームページ</title>

    <style>
        body {
            background-color: #f7f9fa; /* 1. 背景を優しいグレーに */
            color: #333333;           /* 2. 文字を真っ黒ではなく、おしゃれな濃いグレーに */
            font-family: 'Helvetica Neue', Arial, sans-serif; /* 3. すっきりした現代的なフォントに */

            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            color: #4a90e2;           /* 4. 見出しの色をおしゃれな青に */
            font-size: 32px;
            margin-bottom: 20px;
            border-bottom: 2px solid #4a90e2; /* 5. 見出しの下に線を引く */
            padding-bottom: 10px;     /* 6. 線と文字の間に少し隙間をあける */
        }

        p{
            font-size: 16px;
            line-height: 1.8;
            color: #666;
        }

        .btn{
             display: inline-block;
            background-color: #ff6b6b;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px #cf4d4d;
        }
    </style>

</head>
<body>
    <h1>こんにちは！k.s.のウェブサイトへようこそ！</h1>
    <p>GitHubで作った最初のページです。</p>

    <img src="1763617017202.png" alt="おきにいりの画像" width="400">

</html>
